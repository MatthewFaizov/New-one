[project]
name = "sdfg"
version = "0.1.0"
description = "Личный кабинет с транзакциями и запросом в нейросеть (Flask)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.3",
]

[project.scripts]
sdfg = "sdfg:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
