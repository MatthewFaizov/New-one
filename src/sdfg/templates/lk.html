<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card wide">
        <h2>Личный кабинет</h2>

        <!-- Данные берутся из базы: app.py передаёт сюда переменную user -->
        <div class="profile-row"><span>Имя</span><span>{{ user['first_name'] }}</span></div>
        <div class="profile-row"><span>Фамилия</span><span>{{ user['last_name'] }}</span></div>

        <div class="balance">{{ '%.2f' | format(user['balance']) }} ₽</div>

        <!-- Кнопка 1: транзакции -->
        <a class="button" href="{{ url_for('transactions') }}">Транзакции</a>

        <!-- Кнопка 2: запрос в нейросеть -->
        <form id="ai-form" class="ai-block">
            <div class="form-group">
                <label for="question">Вопрос нейросети</label>
                <textarea id="question" placeholder="Например: как накопить 10 000 ₽ за полгода?" required></textarea>
            </div>
            <button type="submit" class="green" id="ai-button">Отправить запрос в нейросеть</button>
            <p class="message" id="message"></p>
            <div class="ai-answer" id="ai-answer" hidden></div>
        </form>

        <div class="switch-link">
            <a href="{{ url_for('logout') }}">Выйти</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
